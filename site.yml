---
- hosts: all
  become: true
  pre_tasks:

  - name: update repository index (CentOS)
    tags: always
    dnf:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "CentOS"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Ubuntu"


- hosts: all
  become: true
  roles:
    - base


- hosts: workstations
  become: true
  roles:
    - workstations


- hosts: web_servers
  become: true
  roles:
    - web_servers


- hosts: db_servers
  become: true
  roles:
    - db_servers


- hosts: file_servers
  become: true
  roles:
    - file_servers

- name: Install and configure Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - elasticsearch

- name: Install and configure Kibana
  hosts: kibana
  become: true
  roles:
    - kibana

- name: Install and configure Logstash
  hosts: logstash
  become: true
  roles:
    - logstash
