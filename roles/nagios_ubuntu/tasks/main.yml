---
- name: Update Ubuntu package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Nagios dependencies on Ubuntu
  ansible.builtin.apt:
    name:
      - gcc
      - make
      - autoconf
      - libc6
      - wget
      - unzip
      - apache2
      - php
      - libapache2-mod-php
      - libgd-dev
      - openssl
      - libssl-dev
      - build-essential
      - snmp
      - libnet-snmp-perl
      - gettext
      - iputils-ping
      - apache2-utils
      - python3-passlib
    state: present

- name: Download Nagios Core
  ansible.builtin.get_url:
    url: https://github.com/NagiosEnterprises/nagioscore/archive/refs/tags/nagios-4.5.13.tar.gz
    dest: /tmp/nagioscore.tar.gz
    mode: '0644'

- name: Extract Nagios Core
  ansible.builtin.unarchive:
    src: /tmp/nagioscore.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/nagioscore-nagios-4.5.13

- name: Create Nagios group
  ansible.builtin.group:
    name: nagios
    state: present

- name: Create Nagios user
  ansible.builtin.user:
    name: nagios
    group: nagios
    shell: /bin/bash
    create_home: true
    state: present

- name: Add Apache user to Nagios group
  ansible.builtin.user:
    name: www-data
    groups: nagios
    append: true

- name: Configure Nagios Core
  ansible.builtin.command:
    cmd: ./configure --with-httpd-conf=/etc/apache2/sites-enabled
    chdir: /tmp/nagioscore-nagios-4.5.13
    creates: /tmp/nagioscore-nagios-4.5.13/Makefile

- name: Compile Nagios Core
  ansible.builtin.command:
    cmd: make all
    chdir: /tmp/nagioscore-nagios-4.5.13
    creates: /tmp/nagioscore-nagios-4.5.13/base/nagios

- name: Install Nagios Core
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/nagioscore-nagios-4.5.13

- name: Install Nagios service
  ansible.builtin.command:
    cmd: make install-daemoninit
    chdir: /tmp/nagioscore-nagios-4.5.13

- name: Install Nagios command mode
  ansible.builtin.command:
    cmd: make install-commandmode
    chdir: /tmp/nagioscore-nagios-4.5.13

- name: Install Nagios configuration
  ansible.builtin.command:
    cmd: make install-config
    chdir: /tmp/nagioscore-nagios-4.5.13

- name: Configure Nagios contact email
  ansible.builtin.lineinfile:
    path: /usr/local/nagios/etc/objects/contacts.cfg
    regexp: '^\s*email\s+'
    line: '        email                           nagiosadmin@localhost'

- name: Install Nagios Apache configuration
  ansible.builtin.command:
    cmd: make install-webconf
    chdir: /tmp/nagioscore-nagios-4.5.13

- name: Enable Apache rewrite module
  community.general.apache2_module:
    name: rewrite
    state: present

- name: Enable Apache CGI module
  community.general.apache2_module:
    name: cgi
    state: present

- name: Create Nagios web user
  community.general.htpasswd:
    path: /usr/local/nagios/etc/htpasswd.users
    name: nagiosadmin
    password: "{{ nagios_web_password }}"
    owner: nagios
    group: nagios
    mode: '0640'

- name: Allow Apache through UFW
  community.general.ufw:
    rule: allow
    name: Apache

- name: Download Nagios Plugins
  ansible.builtin.get_url:
    url: https://github.com/nagios-plugins/nagios-plugins/archive/refs/tags/release-2.5.tar.gz
    dest: /tmp/nagios-plugins.tar.gz
    mode: '0644'

- name: Extract Nagios Plugins
  ansible.builtin.unarchive:
    src: /tmp/nagios-plugins.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/nagios-plugins-release-2.5

- name: Generate Nagios Plugins configure script
  ansible.builtin.command:
    cmd: tools/setup
    chdir: /tmp/nagios-plugins-release-2.5
    creates: /tmp/nagios-plugins-release-2.5/configure

- name: Configure Nagios Plugins
  ansible.builtin.command:
    cmd: ./configure
    chdir: /tmp/nagios-plugins-release-2.5
    creates: /tmp/nagios-plugins-release-2.5/Makefile
- name: Compile Nagios Plugins
  ansible.builtin.command:
    cmd: make
    chdir: /tmp/nagios-plugins-release-2.5

- name: Install Nagios Plugins
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/nagios-plugins-release-2.5

- name: Validate Nagios configuration
  ansible.builtin.command:
    cmd: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
  register: nagios_config_check
  changed_when: false

- name: Enable Nagios
  ansible.builtin.systemd_service:
    name: nagios
    enabled: true

- name: Start Nagios
  ansible.builtin.systemd_service:
    name: nagios
    state: started

- name: Restart Apache
  ansible.builtin.systemd_service:
    name: apache2
    state: restarted
